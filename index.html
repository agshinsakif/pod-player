<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Genius Podcasts</title>

  <!-- iOS PWA Setup -->
  <link rel="apple-touch-icon" sizes="180x180" href="./web-logo.png?v=1">
  <link rel="icon" type="image/png" href="./web-logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Genius Podcasts">

  <style>
    :root {
      --bg: #0c0a14;
      --card-bg: rgba(24, 20, 36, 0.94);
      --card-active: rgba(43, 36, 62, 0.98);
      --text: #f4efff;
      --text-muted: #958ea8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --success: #10b981;
      --border: rgba(255, 255, 255, 0.09);
      --danger: #ef4444;
      --r2-base: https://pub-4749f414275141eea47a778cb1cb7288.r2.dev;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      position: relative;
      padding: max(14px, env(safe-area-inset-top)) 16px 14px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      z-index: 50;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      text-align: center;
    }

    .header-marquee-wrapper {
      display: none;
      width: 70vw;
      max-width: 480px;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      text-align: center;
      mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
    }

    .header-marquee-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: inline-block;
      white-space: nowrap;
      text-align: center;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 140px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    /* Screen Management */
    .screen { display: none; }
    .screen.active { display: block; }

    /* Home Screen */
    .shows-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 70px;
    }

    @media (min-width: 768px) {
      .shows-grid {
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 24px;
      }
      .ss-poster-wrap {
        width: 170px !important;
        height: 170px !important;
      }
    }

    .show-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .show-card:active {
      background: var(--card-active);
      border-color: rgba(139, 92, 246, 0.4);
    }

    .show-poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      background: #1f1b2e;
      margin-bottom: 10px;
    }

    .show-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .flag-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      font-size: 18px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
    }

    .show-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }

    .home-search-wrap {
      position: fixed;
      bottom: calc(80px + env(safe-area-inset-bottom));
      left: 20px;
      right: 20px;
      z-index: 80;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .search-input {
      pointer-events: auto;
      width: 100%;
      max-width: 420px;
      background: rgba(24, 20, 36, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      padding: 10px 16px;
      font-size: 13px;
      outline: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .search-input::placeholder { color: var(--text-muted); }

    /* Show Screen Sticky Header & Controls */
    .ss-sticky-header {
      position: sticky;
      top: -16px;
      z-index: 45;
      background: var(--bg);
      padding: 12px 0 8px;
    }

    .ss-hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
      text-align: center;
      width: 100%;
    }

    .ss-poster-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      margin-bottom: 10px;
    }

    .ss-poster-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .ss-poster-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ss-poster-wrap .flag-badge {
      font-size: 22px;
      bottom: 8px;
      right: 8px;
    }

    .btn-ss-back {
      position: absolute;
      left: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      transition: background 0.15s, transform 0.12s;
    }

    .btn-ss-back:active {
      transform: translateY(-50%) scale(0.92);
      background: var(--card-active);
    }

    .ss-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .ss-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .ss-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(24, 20, 36, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .toggle-label input {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
    }

    .sort-select {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 6px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      outline: none;
      flex-shrink: 0;
      cursor: pointer;
    }

    .ss-search-input {
      width: 82px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      outline: none;
      transition: width 0.22s ease, background 0.15s ease;
    }

    .ss-search-input:focus {
      width: 135px;
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--accent);
    }

    /* Scroll to Top Floating Button */
    .btn-scroll-top {
      position: fixed;
      right: 20px;
      bottom: calc(90px + env(safe-area-inset-bottom));
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 85;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      transition: transform 0.15s;
    }

    .btn-scroll-top:active { transform: scale(0.9); }

    /* Episode Cards */
    .list-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      margin-top: 50px;
      line-height: 1.6;
      font-size: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      transition: background 0.15s, border-color 0.15s;
    }

    .card:active {
      background: var(--card-active);
      border-color: rgba(139, 92, 246, 0.4);
    }

    .card.completed { opacity: 0.55; }

    .card-index {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 28px;
      padding-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .card-content { flex: 1; }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      word-break: break-word;
      line-height: 1.35;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
      align-items: center;
    }

    .badge {
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-completed { color: var(--success); background: rgba(16, 185, 129, 0.15); }
    .badge-resume { color: var(--accent); background: rgba(139, 92, 246, 0.15); }
    .badge-audio { color: #eab308; background: rgba(234, 179, 8, 0.12); }

    /* Player Screen */
    .transcript-view {
      display: block;
      max-width: 680px;
      margin: 0 auto;
    }

    .cue {
      font-size: 19px;
      line-height: 1.65;
      color: var(--text-muted);
      margin-bottom: 24px;
      cursor: pointer;
      user-select: text;
      -webkit-user-select: text;
      transition: color 0.15s;
    }

    .cue.active {
      color: var(--text);
      font-weight: 700;
    }

    /* Playback Dock */
    .playback-buttons-section {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-top: 1px solid var(--border);
      padding: 14px 20px calc(18px + env(safe-area-inset-bottom));
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .pbs-home-title-wrapper {
      display: none;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      text-align: center;
      cursor: pointer;
      mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 12px, black calc(100% - 12px), transparent);
    }

    .pbs-home-title {
      font-size: 15px;
      font-weight: 700;
      color: #0c0a14;
      display: inline-block;
      white-space: nowrap;
    }

    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .time-label {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      min-width: 38px;
    }

    .slider {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 5px;
      touch-action: none;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      margin-bottom: 12px;
    }

    .btn-dock {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speed-btn-wrapper { position: relative; }
    .btn-speed {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .speed-popover {
      position: absolute;
      bottom: calc(100% + 8px);
      left: -8px;
      background: rgba(26, 22, 38, 0.96);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 6px 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      display: none;
      z-index: 250;
    }

    .speed-chips { display: flex; gap: 5px; }
    .speed-chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      border-radius: 12px;
      min-width: 34px;
      height: 28px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .speed-chip.selected { background: #f4efff; color: #0c0a14; font-weight: 800; }

    .btn-seek {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-play-pause {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 22px rgba(139, 92, 246, 0.45);
      flex-shrink: 0;
    }

    .btn-show {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 82%;
      max-width: 320px;
      touch-action: none;
    }

    .volume-icon { color: var(--text-muted); flex-shrink: 0; }
    .volume-slider {
      flex: 1;
      height: 6px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Mini mode */
    .playback-buttons-section.mini-mode {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      left: 20px;
      right: 20px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      border-radius: 16px;
      background: #c4b5fd;
      border: 2px solid rgba(139, 92, 246, 0.4);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      padding: 8px 16px;
      gap: 12px;
    }

    .playback-buttons-section.mini-mode .pbs-home-title-wrapper { display: block; }
    .playback-buttons-section.mini-mode .progress-bar-container,
    .playback-buttons-section.mini-mode .controls-row .speed-btn-wrapper,
    .playback-buttons-section.mini-mode .controls-row .btn-seek,
    .playback-buttons-section.mini-mode .controls-row .btn-show,
    .playback-buttons-section.mini-mode .controls-row .btn-translate-dock,
    .playback-buttons-section.mini-mode .volume-row {
      display: none !important;
    }

    .playback-buttons-section.mini-mode .controls-row {
      margin-bottom: 0;
      width: auto;
      flex-shrink: 0;
    }

    .playback-buttons-section.mini-mode .btn-play-pause {
      width: 38px;
      height: 38px;
      background: var(--bg);
      color: #c4b5fd;
      box-shadow: 0 2px 8px rgba(12, 10, 20, 0.35);
    }

    .playback-buttons-section.mini-mode .btn-play-pause svg {
      width: 18px;
      height: 18px;
    }

    .marquee-active {
      display: inline-block !important;
      white-space: nowrap !important;
      will-change: transform;
      animation: marquee-scroll 12s linear infinite;
    }

    @keyframes marquee-scroll {
      0% { transform: translateX(10%); }
      100% { transform: translateX(-100%); }
    }

        .transcript-view {
      display: block;
      max-width: 680px;
      margin: 0 auto;
      padding-right: 56px;
    }

    .btn-translate-circle {
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      background: #4c1d95;
      color: #ffffff;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 120;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
    }
    .btn-translate-circle:active {
      transform: translateY(-50%) scale(0.92);
    }
    .btn-translate-circle.active {
      background: #a855f7;
      border-color: #ffffff;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.55);
    }
    .sentence-highlight {
      background: rgba(255, 255, 255, 0.18);
      border-radius: 4px;
      padding: 1px 3px;
    }
    .inline-translation-box {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.5;
      color: #c4b5fd;
      margin: 8px 0 16px;
      padding: 8px 12px;
      border-left: 2px solid var(--accent);
      background: rgba(139, 92, 246, 0.08);
      border-radius: 0 8px 8px 0;
      user-select: text;
      -webkit-user-select: text;
    }

    #popover {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      margin: 0 auto;
      max-width: 560px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--accent);
      padding: 14px 18px;
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.65);
      z-index: 300;
      display: none;
      user-select: text;
      -webkit-user-select: text;
    }
  
    /* Player Screen iOS Modal Sheet styling */
    #playerScreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      z-index: 95;
      padding: 0;
      display: flex !important;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.32s cubic-bezier(0.32, 1, 0.23, 1), opacity 0.22s ease;
      pointer-events: none;
    }
    #playerScreen.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    #playerScreen.animating-dismiss {
      transform: translateY(100%) !important;
      opacity: 0.8 !important;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease !important;
    }

    .player-sheet-handle-wrap {
      display: flex;
      justify-content: center;
      padding: 10px 0 16px;
      touch-action: none;
      cursor: grab;
    }
    .player-sheet-handle {
      width: 44px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.38);
    }

    .player-hero-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      padding: 0 4px;
    }
    .player-hero-artwork {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      background: #1f1b2e;
    }
    .player-hero-artwork img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .player-hero-meta {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .player-hero-title-wrap {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      mask-image: linear-gradient(to right, transparent, black 4px, black calc(100% - 14px), transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 4px, black calc(100% - 14px), transparent);
    }
    .player-hero-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      display: inline-block;
      white-space: nowrap;
    }
    .player-hero-show {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Translate Toggle placed on bottom-right playback dock */
    .btn-dock.btn-translate-dock {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      background: #4c1d95;
      color: #ffffff;
      transition: background 0.2s, box-shadow 0.2s, transform 0.12s;
    }
    .btn-dock.btn-translate-dock:active {
      transform: scale(0.92);
    }
    .btn-dock.btn-translate-dock.active {
      background: #a855f7;
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.55);
    }

</style>

  <div id="popover">

    <div id="popoverContent" style="font-size: 15px; color: var(--text);">Translating…</div>
  </div>

  <script>
    const R2_BASE = "https://pub-4749f414275141eea47a778cb1cb7288.r2.dev";
    let showsData = {};
    let currentShow = null;
    let rawEpisodes = [];
    let currentEpisode = null;
    let cues = [];
    let activeCueIndex = -1;

    let wasPlayingBeforeTranslate = false;
    let currentTranslatedSentence = null;
    let isSentenceTranslateActive = false;

    const FLAG_TO_LANG = {
      '🇭🇺': 'hu', '🇩🇪': 'de', '🇪🇸': 'es', '🇫🇷': 'fr', '🇮🇹': 'it',
      '🇷🇺': 'ru', '🇬🇧': 'en', '🇺🇸': 'en', '🇵🇹': 'pt', '🇳🇱': 'nl',
      '🇵🇱': 'pl', '🇹🇷': 'tr', '🇯🇵': 'ja', '🇨🇳': 'zh', '🇺🇦': 'uk'
    };

    function getSourceLang() {
      if (currentShow) {
        if (currentShow.language) return currentShow.language;
        if (currentShow.flag && FLAG_TO_LANG[currentShow.flag]) return FLAG_TO_LANG[currentShow.flag];
      }
      return 'auto';
    }

    async function fetchTranslation(text) {
      const sl = getSourceLang();
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=en&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      return json[0].map(item => item[0]).join('');
    }

    function clearSentenceTranslation(resetToggle = true) {
      currentTranslatedSentence = null;
      if (resetToggle) {
        isSentenceTranslateActive = false;
        const btn = document.getElementById('btnTranslateDock');
        if (btn) btn.classList.remove('active');
      }
      document.querySelectorAll('.inline-translation-box').forEach(el => el.remove());
      cues.forEach((c, idx) => {
        const p = document.getElementById(`cue-${idx}`);
        if (p) p.innerText = c.text;
      });
    }

    function getCurrentSentenceInfo() {
      if (!cues || cues.length === 0 || activeCueIndex < 0) return null;
      const joined = cues.map(c => c.text).join(' ');
      const cueOffsets = [];
      let charAcc = 0;
      cues.forEach(c => {
        cueOffsets.push({ start: charAcc, end: charAcc + c.text.length });
        charAcc += c.text.length + 1;
      });

      const activeMid = (cueOffsets[activeCueIndex].start + cueOffsets[activeCueIndex].end) / 2;
      const prevDot = joined.lastIndexOf('.', Math.max(0, activeMid - 1));
      const nextDot = joined.indexOf('.', activeMid);
      const sStart = prevDot === -1 ? 0 : prevDot + 1;
      const sEnd = nextDot === -1 ? joined.length : nextDot + 1;
      const sentenceText = joined.slice(sStart, sEnd).trim();
      if (!sentenceText) return null;

      let startCueIdx = cueOffsets.findIndex(o => sStart < o.end);
      let endCueIdx = cueOffsets.findIndex(o => sEnd <= o.end);
      if (startCueIdx === -1) startCueIdx = 0;
      if (endCueIdx === -1) endCueIdx = cues.length - 1;

      return { text: sentenceText, sStart, sEnd, startCueIdx, endCueIdx, cueOffsets };
    }

    async function updateSentenceTranslation(force = false) {
      if (!isSentenceTranslateActive) return;
      const info = getCurrentSentenceInfo();
      if (!info) return;
      if (!force && currentTranslatedSentence === info.text) return;

      clearSentenceTranslation(false);
      currentTranslatedSentence = info.text;

      for (let i = info.startCueIdx; i <= info.endCueIdx; i++) {
        const c = cues[i];
        const off = info.cueOffsets[i];
        const hStart = Math.max(0, info.sStart - off.start);
        const hEnd = Math.min(c.text.length, info.sEnd - off.start);
        const p = document.getElementById(`cue-${i}`);
        if (p && hStart < hEnd) {
          p.innerHTML = `${c.text.slice(0, hStart)}<span class="sentence-highlight">${c.text.slice(hStart, hEnd)}</span>${c.text.slice(hEnd)}`;
        }
      }

      const targetCueP = document.getElementById(`cue-${info.endCueIdx}`);
      if (!targetCueP) return;

      const box = document.createElement('div');
      box.className = 'inline-translation-box';
      box.innerText = 'Translating sentence…';
      targetCueP.after(box);

      try {
        const translated = await fetchTranslation(info.text);
        if (isSentenceTranslateActive && currentTranslatedSentence === info.text) {
          box.innerText = translated;
        }
      } catch (e) {
        if (isSentenceTranslateActive && currentTranslatedSentence === info.text) box.innerText = 'Translation failed.';
      }
    }

    function toggleSentenceTranslation() {
      const btn = document.getElementById('btnTranslateDock');
      isSentenceTranslateActive = !isSentenceTranslateActive;
      if (btn) if (btn) btn.classList.toggle('active', isSentenceTranslateActive);

      if (isSentenceTranslateActive) {
        updateSentenceTranslation(true);
      } else {
        clearSentenceTranslation(true);
      }
    }
    
    
    let isTranslatingOpen = false;

    const speedOptions = [
      { val: 0.75, label: "0,75" },
      { val: 0.9,  label: "0,9" },
      { val: 1.0,  label: "1x" },
      { val: 1.1,  label: "1,1" },
      { val: 1.25, label: "1,25" },
      { val: 1.5,  label: "1,5" },
      { val: 2.0,  label: "2" }
    ];
    let selectedSpeed = 1.0;

    const mainContainer = document.getElementById('mainContainer');
    const homeScreen = document.getElementById('homeScreen');
    const showScreen = document.getElementById('showScreen');
    const playerScreen = document.getElementById('playerScreen');
    const showsGrid = document.getElementById('showsGrid');
    const homeSearchWrap = document.getElementById('homeSearchWrap');
    const homeSearchInput = document.getElementById('homeSearchInput');

    const ssPoster = document.getElementById('ssPoster');
    const ssFlag = document.getElementById('ssFlag');
    const ssTitle = document.getElementById('ssTitle');
    const ssEpisodeCount = document.getElementById('ssEpisodeCount');
    const ssSearchInput = document.getElementById('ssSearchInput');
    const hideCompletedCheck = document.getElementById('hideCompletedCheck');
    const sortSelect = document.getElementById('sortSelect');
    const episodesListView = document.getElementById('episodesListView');
    const ssScrollTopBtn = document.getElementById('ssScrollTopBtn');

    const headerBrandTitle = document.getElementById('headerBrandTitle');
    const headerMarqueeWrapper = document.getElementById('headerMarqueeWrapper');
    const headerMarqueeText = document.getElementById('headerMarqueeText');

    const playbackButtonsSection = document.getElementById('playbackButtonsSection');
    const pbsHomeTitleWrapper = document.getElementById('pbsHomeTitleWrapper');
    const pbsHomeTitle = document.getElementById('pbsHomeTitle');
    const audioElement = document.getElementById('audioElement');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const seekBar = document.getElementById('seekBar');
    const speedBtn = document.getElementById('speedBtn');
    const speedPopover = document.getElementById('speedPopover');
    const speedChips = document.getElementById('speedChips');
    const volumeBar = document.getElementById('volumeBar');
    const transcriptView = document.getElementById('transcriptView');
    const popover = document.getElementById('popover');
    const popoverContent = document.getElementById('popoverContent');

    function safeUrl(path) {
      if (!path) return "";
      if (path.startsWith("http://") || path.startsWith("https://")) {
        return encodeURI(decodeURI(path));
      }
      return path.split('/').map(seg => encodeURIComponent(decodeURIComponent(seg))).join('/');
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec <= 0) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

        // --- History Navigation Management ---
    let isRoutingTransition = false;

    function navigate(screen, extraId = null) {
      let targetHash = "#/";
      if (screen === 'show') {
        const sId = extraId || (currentShow ? (currentShow.show_id || currentShow.folder) : null);
        if (sId) targetHash = `#/show/${sId}`;
      } else if (screen === 'player' && currentEpisode) {
        const sId = currentShow ? (currentShow.show_id || currentShow.folder) : "";
        targetHash = `#/player/${sId}/${encodeURIComponent(currentEpisode.title)}`;
      }

      if (window.location.hash !== targetHash) {
        history.pushState(null, "", targetHash);
        applyRoute();
      }
    }

    async function applyRoute() {
      if (isRoutingTransition) return;
      isRoutingTransition = true;

      try {
        // Wait until showsData is populated
        if (!showsData || Object.keys(showsData).length === 0) {
          return;
        }

        const hash = window.location.hash || "#/";
        const parts = hash.slice(1).split("/").filter(Boolean);
        console.log("[Router] Applying route:", hash, parts);

        if (parts.length === 0 || parts[0] === "") {
          switchScreen('home');
        } else if (parts[0] === 'show' && parts[1]) {
          const showId = parts[1];
          const s = showsData[showId] || Object.values(showsData).find(x => (x.show_id === showId || x.folder === showId));
          if (s) {
            await openShow(s, true);
          } else {
            console.warn("[Router] Show not found:", showId);
            switchScreen('home');
          }
        } else if (parts[0] === 'player') {
          const showId = parts[1];
          const epTitle = decodeURIComponent(parts[2] || "");
          if (showId && (!currentShow || (currentShow.show_id || currentShow.folder) !== showId)) {
            const s = showsData[showId] || Object.values(showsData).find(x => (x.show_id === showId || x.folder === showId));
            if (s) await openShow(s, false);
          }
          if (epTitle && (!currentEpisode || currentEpisode.title !== epTitle)) {
            const found = rawEpisodes.find(e => e.title === epTitle);
            if (found) await playEpisode(found, found.originalIndex, false);
          }
          switchScreen('player');
        }
      } catch (err) {
        console.error("[Router Error]", err);
      } finally {
        isRoutingTransition = false;
      }
    }

    window.addEventListener("popstate", applyRoute);
    window.addEventListener("hashchange", applyRoute);

    function dismissPlayerScreen(targetScreen) {
      if (!playerScreen.classList.contains('active')) {
        navigate(targetScreen || (currentShow ? 'show' : 'home'));
        return;
      }
      playerScreen.classList.add('animating-dismiss');
      setTimeout(() => {
        playerScreen.classList.remove('animating-dismiss');
        navigate(targetScreen || (currentShow ? 'show' : 'home'));
      }, 260);
    }

    function switchScreen(screen) {
      homeScreen.classList.remove('active');
      showScreen.classList.remove('active');

      if (screen === 'player') {
        playerScreen.classList.add('active');
        homeSearchWrap.style.display = 'none';
        headerBrandTitle.style.display = 'none';
        headerMarqueeWrapper.style.display = 'none';
        playbackButtonsSection.classList.remove('mini-mode');
        if (ssScrollTopBtn) ssScrollTopBtn.style.display = 'none';
        updatePlayerHeroUI();
        return;
      }

      playerScreen.classList.remove('active');
      clearSentenceTranslation();

      if (screen === 'home') {
        homeScreen.classList.add('active');
        homeSearchWrap.style.display = 'flex';
        headerBrandTitle.style.display = 'block';
        headerBrandTitle.innerText = "Genius Podcasts";
        headerMarqueeWrapper.style.display = 'none';
        playbackButtonsSection.classList.add('mini-mode');
        if (ssScrollTopBtn) ssScrollTopBtn.style.display = 'none';
      } else if (screen === 'show') {
        showScreen.classList.add('active');
        homeSearchWrap.style.display = 'none';
        headerBrandTitle.style.display = 'none';
        headerMarqueeWrapper.style.display = 'none';
        playbackButtonsSection.classList.add('mini-mode');
        ssSearchInput.value = '';
        renderEpisodeList();
      } else if (screen === 'player') {
        playerScreen.classList.add('active');
        homeSearchWrap.style.display = 'none';
        headerBrandTitle.style.display = 'none';
        headerMarqueeWrapper.style.display = 'block';
        playbackButtonsSection.classList.remove('mini-mode');
        if (ssScrollTopBtn) ssScrollTopBtn.style.display = 'none';
        updateMarquees();
      }
    }

    async function loadShows() {
      try {
        const res = await fetch('shows.json?nocache=' + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        showsData = await res.json();
        renderShowsGrid(showsData);
        restoreLastState();
        applyRoute();
      } catch (err) {
        showsGrid.innerHTML = `<div class="empty-state">Could not load shows.json (${err.message})</div>`;
      }
    }

    function renderShowsGrid(shows) {
      showsGrid.innerHTML = '';
      Object.keys(shows).forEach(key => {
        const s = shows[key];
        const card = document.createElement('div');
        card.className = 'show-card';
        const showId = s.show_id || key;
        const logoUrl = safeUrl(`${R2_BASE}/logos/${showId}.png`);
        card.innerHTML = `
          <div class="show-poster-wrap">
            <img class="show-poster" src="${logoUrl}" onerror="this.src='./web-logo.png'" alt="${s.name}">
            <span class="flag-badge">${s.flag || ''}</span>
          </div>
          <div class="show-name">${s.name}</div>
        `;
        card.onclick = () => {
          navigate('show', showId);
        };
        showsGrid.appendChild(card);
      });
    }

    function filterShows() {
      const q = homeSearchInput.value.toLowerCase().trim();
      const filtered = {};
      Object.keys(showsData).forEach(k => {
        if (showsData[k].name.toLowerCase().includes(q)) filtered[k] = showsData[k];
      });
      renderShowsGrid(filtered);
    }

    async function openShow(show, shouldSwitch = true) {
      currentShow = show;
      ssTitle.innerText = show.name;
      ssFlag.innerText = show.flag || '';
      const showId = show.show_id || show.folder;
      ssPoster.src = safeUrl(`${R2_BASE}/logos/${showId}.png`);
      ssPoster.onerror = () => { ssPoster.src = './web-logo.png'; };
      episodesListView.innerHTML = '<div class="empty-state">Loading episodes…</div>';

      if (shouldSwitch) {
        switchScreen('show');
        mainContainer.scrollTo({ top: 0 });
      }

      try {
        const playlistUrl = "playlist.json?nocache=" + Date.now();
        const res = await fetch(playlistUrl);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const allEpisodes = await res.json();
        const fetchedList = allEpisodes.filter(ep => ep.show_id === showId || ep.folder === showId);

        fetchedList.sort((a, b) => (b.raw_date || b.upload_date || "").localeCompare(a.raw_date || a.upload_date || ""));

        rawEpisodes = fetchedList.map((ep, idx) => ({
          ...ep,
          originalIndex: idx + 1
        }));

        renderEpisodeList();
      } catch (err) {
        episodesListView.innerHTML = `<div class="empty-state">Could not load playlist (${err.message}).</div>`;
        ssEpisodeCount.innerText = "0 episodes";
      }
    }

    function renderEpisodeList() {
      const query = ssSearchInput.value.toLowerCase().trim();
      const hideCompleted = hideCompletedCheck.checked;
      const mode = sortSelect.value;

      let list = [...rawEpisodes];

      if (query) {
        list = list.filter(ep => ep.title.toLowerCase().includes(query));
      }

      if (mode === 'date-desc') {
        // Newest to Oldest (default)
        list.sort((a, b) => (b.raw_date || b.upload_date || "").localeCompare(a.raw_date || a.upload_date || ""));
      } else if (mode === 'date-asc') {
        // Oldest to Newest
        list.sort((a, b) => (a.raw_date || a.upload_date || "").localeCompare(b.raw_date || b.upload_date || ""));
      } else if (mode === 'alpha-asc') {
        // Title A -> Z
        list.sort((a, b) => (a.title || "").localeCompare(b.title || "", undefined, { sensitivity: 'base' }));
      } else if (mode === 'alpha-desc') {
        // Title Z -> A
        list.sort((a, b) => (b.title || "").localeCompare(a.title || "", undefined, { sensitivity: 'base' }));
      }

      episodesListView.innerHTML = '';
      let visible = 0;

      list.forEach(ep => {
        const isDone = localStorage.getItem('done_' + ep.title) === 'true';
        if (hideCompleted && isDone) return;
        visible++;

        const savedPos = parseFloat(localStorage.getItem('pos_' + ep.title) || '0');
        const card = document.createElement('div');
        card.className = `card ${isDone ? 'completed' : ''}`;

        const displayIndex = ep.originalIndex;

        card.innerHTML = `
          <div class="card-index">${displayIndex}.</div>
          <div class="card-content">
            <div class="card-title">${ep.title}</div>
            <div class="card-meta">
              ${ep.upload_date ? `<span>📅 ${ep.upload_date}</span>` : ''}
              ${!ep.vtt ? '<span class="badge badge-audio">Audio only</span>' : ''}
              ${isDone ? '<span class="badge badge-completed">Completed</span>' : ''}
              ${!isDone && savedPos > 5 ? `<span class="badge badge-resume">Resume ${formatTime(savedPos)}</span>` : ''}
            </div>
          </div>
        `;
        card.onclick = () => {
          playEpisode(ep, displayIndex);
          navigate('player');
        };
        episodesListView.appendChild(card);
      });

      ssEpisodeCount.innerText = `${rawEpisodes.length} episode${rawEpisodes.length === 1 ? '' : 's'}`;
      if (visible === 0) {
        episodesListView.innerHTML = '<div class="empty-state">No episodes match your criteria.</div>';
      }
    }

    async function playEpisode(ep, displayIndex, startPaused = false) {
      currentEpisode = ep;
      currentEpisode.displayIndex = displayIndex;
      localStorage.setItem('last_played_state', JSON.stringify({
        show: currentShow,
        episode: ep,
        displayIndex: displayIndex
      }));

      const titleWithIndex = displayIndex ? `${displayIndex}. ${ep.title}` : ep.title;
      pbsHomeTitle.innerText = titleWithIndex;
      headerMarqueeText.innerText = titleWithIndex;
      updatePlayerHeroUI();

      audioElement.src = safeUrl(ep.audio);
      audioElement.load();
      audioElement.playbackRate = selectedSpeed;

      const wasDone = localStorage.getItem('done_' + ep.title) === 'true';
      const savedTime = parseFloat(localStorage.getItem('pos_' + ep.title) || '0');

      if (wasDone) {
        localStorage.removeItem('done_' + ep.title);
        localStorage.setItem('pos_' + ep.title, '0');
        audioElement.currentTime = 0;
      }

      audioElement.onloadedmetadata = () => {
        timeTotal.innerText = formatTime(audioElement.duration);
        seekBar.max = audioElement.duration || 100;
        if (!wasDone && savedTime > 0 && savedTime < (audioElement.duration - 5)) {
          audioElement.currentTime = savedTime;
        }
      };

      loadTranscript(ep.vtt);

      if (!startPaused) {
        audioElement.play().catch(() => {});
      }
    }

    function navigateToCurrentShow() {
      if (currentShow) {
        navigate('show', currentShow.show_id || currentShow.folder);
      } else {
        navigate('home');
      }
    }

    function parseVttTime(str) {
      const parts = str.trim().split(":");
      let h = 0, m = 0, sParts;
      if (parts.length === 3) {
        h = parseInt(parts[0], 10) || 0;
        m = parseInt(parts[1], 10) || 0;
        sParts = (parts[2] || "").split(".");
      } else {
        m = parseInt(parts[0], 10) || 0;
        sParts = (parts[1] || "").split(".");
      }
      const s = parseInt(sParts[0], 10) || 0;
      const ms = sParts[1] ? parseInt(sParts[1].padEnd(3, "0").slice(0, 3), 10) : 0;
      return h * 3600 + m * 60 + s + ms / 1000;
    }

    function parseVtt(text) {
      const clean = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
      const lines = clean.split('\n');
      const list = [];
      let i = 0;

      while (i < lines.length) {
        const line = lines[i].trim();
        if (line.includes('-->')) {
          const parts = line.split('-->');
          const start = parseVttTime(parts[0].trim().split(/\s+/)[0]);
          const end = parseVttTime(parts[1].trim().split(/\s+/)[0]);
          const textLines = [];
          i++;

          while (i < lines.length) {
            const subLine = lines[i].trim();
            if (subLine === '' || subLine.includes('-->')) break;
            textLines.push(subLine);
            i++;
          }

          const cueText = textLines
            .join(' ')
            .replace(/<\d{2}:\d{2}:\d{2}\.\d{3}>/g, '')
            .replace(/<[^>]*>/g, '')
            .trim();

          if (cueText) list.push({ start, end, text: cueText });
        } else {
          i++;
        }
      }
      return list;
    }

    async function loadTranscript(vttUrl) {
      cues = [];
      activeCueIndex = -1;
      transcriptView.innerHTML = '';

      if (!vttUrl) {
        transcriptView.innerHTML = '<div class="empty-state">No transcript available for this track.</div>';
        return;
      }

      try {
        const urlToFetch = safeUrl(vttUrl);
        const glue = urlToFetch.includes('?') ? '&' : '?';
        const res = await fetch(urlToFetch + glue + 'nocache=' + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        cues = parseVtt(text);
        if (cues.length > 0) {
          renderTranscript();
        } else {
          transcriptView.innerHTML = '<div class="empty-state">Transcript contains no text cues.</div>';
        }
      } catch (err) {
        transcriptView.innerHTML = `<div class="empty-state" style="color:var(--danger)">Could not load transcript (${err.message})</div>`;
      }
    }

    function renderTranscript() {
      transcriptView.innerHTML = '';
      cues.forEach((cue, i) => {
        const p = document.createElement('p');
        p.className = 'cue';
        p.id = `cue-${i}`;
        p.innerText = cue.text;
        p.onclick = () => {
          const sel = window.getSelection().toString().trim();
          if (sel.length > 0) return;
          audioElement.currentTime = cue.start;
          audioElement.play().catch(() => {});
        };
        transcriptView.appendChild(p);
      });
    }

    function togglePlay(e) {
      if (e) e.stopPropagation();
      closeSpeedPopover();
      if (!audioElement.src) return;
      if (audioElement.paused) {
        audioElement.play().catch(() => {});
      } else {
        audioElement.pause();
      }
    }

    function seekRelative(sec) {
      closeSpeedPopover();
      if (!audioElement.duration) return;
      audioElement.currentTime = Math.max(0, Math.min(audioElement.duration, audioElement.currentTime + sec));
    }

    audioElement.addEventListener('play', () => {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    });

    audioElement.addEventListener('pause', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    });

    audioElement.addEventListener('timeupdate', () => {
      const cur = audioElement.currentTime;
      const dur = audioElement.duration || 0;
      timeCurrent.innerText = formatTime(cur);
      seekBar.value = cur;

      if (currentEpisode && cur > 0) {
        localStorage.setItem('pos_' + currentEpisode.title, cur.toString());
        if (dur > 0 && (cur >= dur - 5 || cur / dur >= 0.98)) {
          localStorage.setItem('done_' + currentEpisode.title, 'true');
        } else if (localStorage.getItem('done_' + currentEpisode.title) === 'true' && cur < dur - 10) {
          localStorage.removeItem('done_' + currentEpisode.title);
        }
      }

      let idx = -1;
      for (let i = cues.length - 1; i >= 0; i--) {
        if (cur >= cues[i].start) {
          idx = i;
          break;
        }
      }

      if (idx !== -1 && idx !== activeCueIndex) {
        if (activeCueIndex !== -1) {
          const old = document.getElementById(`cue-${activeCueIndex}`);
          if (old) old.classList.remove('active');
        }
        activeCueIndex = idx;
        const current = document.getElementById(`cue-${activeCueIndex}`);
        if (current) {
          current.classList.add('active');
          current.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    });

    seekBar.addEventListener('input', (e) => {
      audioElement.currentTime = Number(e.target.value);
    });

    function setSpeed(val, label) {
      selectedSpeed = val;
      audioElement.playbackRate = val;
      speedBtn.innerText = label || (val + "x");
      renderSpeedMenu();
    }

    function renderSpeedMenu() {
      speedChips.innerHTML = '';
      speedOptions.forEach(opt => {
        const chip = document.createElement('button');
        chip.className = `speed-chip ${opt.val === selectedSpeed ? 'selected' : ''}`;
        chip.innerText = opt.label;
        chip.onclick = (e) => {
          e.stopPropagation();
          setSpeed(opt.val, opt.label);
          closeSpeedPopover();
        };
        speedChips.appendChild(chip);
      });
    }

    function toggleSpeedPopover(e) {
      e.stopPropagation();
      const isOpen = speedPopover.style.display === 'block';
      if (isOpen) closeSpeedPopover();
      else speedPopover.style.display = 'block';
    }

    function closeSpeedPopover() {
      speedPopover.style.display = 'none';
    }

    volumeBar.addEventListener('input', (e) => {
      audioElement.volume = parseFloat(e.target.value);
    });

    mainContainer.addEventListener('scroll', () => {
      if (!showScreen.classList.contains('active')) {
        if (ssScrollTopBtn) ssScrollTopBtn.style.display = 'none';
        return;
      }
      if (mainContainer.scrollTop > 180) {
        if (ssScrollTopBtn) ssScrollTopBtn.style.display = 'flex';
      } else {
        if (ssScrollTopBtn) ssScrollTopBtn.style.display = 'none';
      }
    });

    function scrollToTopSS() {
      mainContainer.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        togglePlay();
      }
      if ((e.key === 'q' || e.key === 'Q') && playerScreen.classList.contains('active')) {
        e.preventDefault();
        toggleSentenceTranslation();
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    document.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        const elapsed = Date.now() - touchStartTime;

        if (touchStartX < 50 && deltaX > 70 && Math.abs(deltaY) < 60 && elapsed < 400) {
          if (showScreen.classList.contains('active')) {
            navigate('home');
          } else if (playerScreen.classList.contains('active')) {
            navigateToCurrentShow();
          }
        }
      }
    }, { passive: true });

    
    function updatePlayerHeroUI() {
      const pht = document.getElementById('playerHeroTitle');
      const phs = document.getElementById('playerHeroShow');
      const php = document.getElementById('playerHeroPoster');
      if (currentEpisode && pht) {
        pht.innerText = currentEpisode.displayIndex ? `${currentEpisode.displayIndex}. ${currentEpisode.title}` : currentEpisode.title;
      }
      if (currentShow) {
        if (phs) phs.innerText = currentShow.name || '';
        if (php) {
          const sId = currentShow.show_id || currentShow.folder;
          php.src = safeUrl(`${R2_BASE}/logos/${sId}.png`);
          php.onerror = () => { php.src = './web-logo.png'; };
        }
      }
      updateMarquees();
    }

    function updateMarquees() {
      headerMarqueeText.classList.remove("marquee-active");
      pbsHomeTitle.classList.remove("marquee-active");
      requestAnimationFrame(() => {
        setTimeout(() => {
          if (headerMarqueeWrapper.style.display === "block" && headerMarqueeText.scrollWidth > headerMarqueeWrapper.clientWidth) {
            headerMarqueeText.classList.add("marquee-active");
          }
          const pht = document.getElementById('playerHeroTitle');
          const phtWrap = document.getElementById('playerHeroTitleWrap');
          if (pht && phtWrap) {
            pht.classList.remove('marquee-active');
            if (pht.scrollWidth > phtWrap.clientWidth) pht.classList.add('marquee-active');
          }
          if (pbsHomeTitle.scrollWidth > pbsHomeTitleWrapper.clientWidth) {
            pbsHomeTitle.classList.add("marquee-active");
          }
        }, 100);
      });
    }

    function restoreLastState() {
      const savedState = localStorage.getItem('last_played_state');
      if (savedState) {
        try {
          const parsed = JSON.parse(savedState);
          currentShow = parsed.show;
          playEpisode(parsed.episode, parsed.displayIndex, true);
        } catch (e) {}
      }
    }

    document.addEventListener('selectionchange', () => {
      const sel = window.getSelection();
      const txt = sel ? sel.toString().trim() : '';
      if (!txt) return;

      if (!isTranslatingOpen) {
        wasPlayingBeforeTranslate = !audioElement.paused;
        if (!audioElement.paused) audioElement.pause();
        isTranslatingOpen = true;
      }

      popover.style.display = 'block';
      popoverContent.innerText = 'Translating…';

      fetchTranslation(txt)
        .then(translated => {
          popoverContent.innerText = translated || "No translation found.";
        })
        .catch(() => {
          popoverContent.innerText = 'Translation failed.';
        });
    });

    document.addEventListener('pointerdown', (e) => {
      if (popover && !popover.contains(e.target)) {
        if (isTranslatingOpen) {
          popover.style.display = 'none';
          isTranslatingOpen = false;
          window.getSelection()?.removeAllRanges();
          if (wasPlayingBeforeTranslate) {
            wasPlayingBeforeTranslate = false;
            audioElement.play().catch(() => {});
          }
        }
      }
      if (!speedPopover.contains(e.target) && e.target !== speedBtn) closeSpeedPopover();
    });

    renderSpeedMenu();
    
        // --- Apple Music-style interactive pull down to dismiss ---
    (function initPlayerSheetDismiss() {
      const ps = document.getElementById('playerScreen');
      const bar = document.getElementById('playerTopBar');
      const tv = document.getElementById('transcriptView');
      let startY = 0;
      let curY = 0;
      let isDragging = false;
      let fromScrollTop = false;

      function onTouchStart(e) {
        if (!ps.classList.contains('active')) return;
        const touch = e.touches[0];
        const isFromTopBar = bar && bar.contains(e.target);
        const isAtTop = tv ? tv.scrollTop <= 2 : true;

        if (isFromTopBar || isAtTop) {
          startY = touch.clientY;
          curY = 0;
          isDragging = true;
          fromScrollTop = !isFromTopBar;
          ps.style.transition = 'none';
        }
      }

      function onTouchMove(e) {
        if (!isDragging) return;
        const delta = e.touches[0].clientY - startY;
        if (delta > 0) {
          if (fromScrollTop && tv && tv.scrollTop > 2) {
            isDragging = false;
            ps.style.transform = '';
            return;
          }
          e.preventDefault();
          curY = delta;
          ps.style.transform = `translateY(${delta}px)`;
        } else if (!fromScrollTop) {
          ps.style.transform = 'translateY(0)';
        }
      }

      function onTouchEnd() {
        if (!isDragging) return;
        isDragging = false;
        ps.style.transition = 'transform 0.28s cubic-bezier(0.32, 1, 0.23, 1), opacity 0.2s ease';
        if (curY > 100) {
          dismissPlayerScreen();
        } else {
          ps.style.transform = 'translateY(0)';
        }
      }

      ps.addEventListener('touchstart', onTouchStart, { passive: true });
      ps.addEventListener('touchmove', onTouchMove, { passive: false });
      ps.addEventListener('touchend', onTouchEnd, { passive: true });
      const handle = document.getElementById('playerSheetHandle');
      if (handle) handle.addEventListener('click', () => dismissPlayerScreen());
    })();

    loadShows();
  </script>
